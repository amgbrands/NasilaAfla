<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Nasila Afla</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css" />

  <style>
    body { padding-top: 90px; }

    .cart-container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 40px;
    }

    .cart-item {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      cursor: pointer;
      font-weight: bold;
    }

    .summary {
      background: var(--primary);
      color: #fff;
      border-radius: 18px;
      padding: 25px;
      position: sticky;
      top: 110px;
      height: fit-content;
    }

    .summary p {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
    }

    .summary hr { border-color: rgba(255,255,255,0.2); }

    .checkout {
      margin-top: 15px;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
    }

    .clear-btn {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 30px;
      cursor: pointer;
    }

    @media(max-width: 768px) {
      .cart-container { grid-template-columns: 1fr; }
    }
  </style>

  <!-- Prevent caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

</head>
<body>

<header id="navbar">
  <div class="container">
    <nav>
      <div class="logo">Nasila Afla Self Help Group</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#store">Store</a>
        <a href="index.html#team">Team</a>
        <a href="cart.html">Cart</a>
      </div>
    </nav>
  </div>
</header>

<div class="cart-container">

  <div>
    <h2>Your Order</h2>
    <div id="cart-items"></div>
  </div>

  <div class="summary">
    <h3>Payment Summary</h3>
    <p><span>Subtotal</span><span id="subtotal">KES 0</span></p>
    <hr />
    <p><strong>Total</strong><strong id="total">KES 0</strong></p>

    <h4 style="margin-top:25px">Payment Details</h4>
    <p>M-PESA Number:<br><strong>+254702171437</strong></p>
    <p>M-PESA Till:<br><strong>3358164</strong></p>

    <button class="checkout" onclick="placeOrder()">Place Order</button>
    <button class="clear-btn" onclick="clearOrder()">Clear Order</button>
  </div>

</div>

 <script>
  // Reset cart only on first page load if cart is empty
  let initialCart = JSON.parse(localStorage.getItem('cart')) || [];
  const products = [
    { name: 'Latte', price: 250 },
    { name: 'Irish Coffee', price: 300 },
    { name: 'Caffè Macchiato', price: 280 }
  ];

  if (initialCart.length === 0) {
    products.forEach(p => initialCart.push({ ...p, qty: 0 }));
    localStorage.setItem('cart', JSON.stringify(initialCart));
  }

  let cart = JSON.parse(localStorage.getItem('cart')) || initialCart;

  const cartContainer = document.getElementById('cart-items');
  const subtotalEl = document.getElementById('subtotal');
  const totalEl = document.getElementById('total');

  function renderCart() {
    cartContainer.innerHTML = '';
    let subtotal = 0;

    cart.forEach((item, index) => {
      subtotal += item.price * item.qty;

      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = ` 
        <h4>${item.name}</h4>
        <span>KES ${item.price}</span>
        <div class="qty">
          <button onclick="updateQty(${index}, -1)">−</button>
          <input type='number' min='0' value='${item.qty}' style='width:50px;text-align:center;' onchange='manualQty(${index}, this.value)'>
          <button onclick="updateQty(${index}, 1)">+</button>
        </div>
        <strong>KES ${item.price * item.qty}</strong>
      `;
      cartContainer.appendChild(div);
    });

    subtotalEl.textContent = `KES ${subtotal}`;
    totalEl.innerHTML = `<strong>KES ${subtotal}</strong>`;

    localStorage.setItem('cart', JSON.stringify(cart));
  }

  function updateQty(index, change) {
    cart[index].qty = Math.max(0, cart[index].qty + change);
    renderCart();
  }

  function manualQty(index, value) {
    let val = parseInt(value);
    if (isNaN(val) || val < 0) val = 0;
    cart[index].qty = val;
    renderCart();
  }

  function clearOrder() {
    if (confirm('Are you sure you want to reset all orders?')) {
      cart.forEach(item => item.qty = 0);
      renderCart();
    }
  }

  function placeOrder() {
    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

    if (total === 0) {
      alert('Your cart is empty. Add something tasty first ☕');
      return;
    }

    // Create modal elements
    const modalBg = document.createElement('div');
    modalBg.style.position = 'fixed';
    modalBg.style.top = 0;
    modalBg.style.left = 0;
    modalBg.style.width = '100%';
    modalBg.style.height = '100%';
    modalBg.style.background = 'rgba(0,0,0,0.6)';
    modalBg.style.display = 'flex';
    modalBg.style.alignItems = 'center';
    modalBg.style.justifyContent = 'center';
    modalBg.style.zIndex = 1000;

    const modalContent = document.createElement('div');
    modalContent.style.background = '#fff';
    modalContent.style.padding = '30px';
    modalContent.style.borderRadius = '16px';
    modalContent.style.maxWidth = '400px';
    modalContent.style.textAlign = 'center';
    modalContent.style.fontFamily = 'Poppins, sans-serif';

    modalContent.innerHTML = `
      <h2>Hey there 👋</h2>
      <p>Thank you for your order!</p>
      <p><strong style="font-size:1.2rem">Total Payable: KES ${total}</strong></p>
      <p>Kindly pay using any of the options below:</p>
      <p>M-PESA Number: <strong>+254702171437</strong><br>M-PESA Till: <strong>3358164</strong></p>
      <button id="closeModal" style="margin-top:15px;padding:12px 24px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;">Close</button>
    `;

    modalBg.appendChild(modalContent);
    document.body.appendChild(modalBg);

    // Only reset cart when user closes modal
    document.getElementById('closeModal').onclick = () => {
      document.body.removeChild(modalBg);
      clearOrder();
    };
  }

  // Confirm before leaving page and retain cart values
  window.onbeforeunload = function(e) {
    if (cart.some(item => item.qty > 0)) {
      e.preventDefault();
      e.returnValue = 'You have items in your cart. Are you sure you want to leave?';
    }
  };

  renderCart();
</script>

<style>
/* Floating mobile nav button */
.mobile-nav-toggle {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 50px;
  height: 50px;
  background: var(--primary);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  z-index: 100;
  cursor: pointer;
}

.mobile-nav {
  display: none;
  position: fixed;
  bottom: 80px;
  right: 20px;
  background: var(--primary);
  border-radius: 12px;
  flex-direction: column;
  padding: 10px;
  gap: 10px;
  z-index: 100;
}

.mobile-nav a {
  color: white;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--accent);
  text-align: center;
}

@media (max-width: 768px) {
  .mobile-nav-toggle {
    display: flex;
  }
}
</style>

<!-- Floating mobile nav button -->
<div class="mobile-nav-toggle" id="mobileNavToggle">☰</div>
<div class="mobile-nav" id="mobileNav">
  <a href="index.html">Home</a>
  <a href="cart.html">Cart</a>
   <a href="wip.html">WIP</a>
</div>

<script>
  const mobileToggle = document.getElementById('mobileNavToggle');
  const mobileNav = document.getElementById('mobileNav');

  mobileToggle.addEventListener('click', () => {
    if (mobileNav.style.display === 'flex') {
      mobileNav.style.display = 'none';
    } else {
      mobileNav.style.display = 'flex';
    }
  });
</script>


</body>
</html>
