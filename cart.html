<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Nasila Afla</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css" />

  <style>
    body { padding-top: 90px; }

    .cart-container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 40px;
    }

    .cart-item {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      cursor: pointer;
      font-weight: bold;
    }

    .summary {
      background: var(--primary);
      color: #fff;
      border-radius: 18px;
      padding: 25px;
      position: sticky;
      top: 110px;
      height: fit-content;
    }

    .summary p {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
    }

    .summary hr { border-color: rgba(255,255,255,0.2); }

    .checkout {
      margin-top: 15px;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
    }

    .clear-btn {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 30px;
      cursor: pointer;
    }

    @media(max-width: 768px) {
      .cart-container { grid-template-columns: 1fr; }
    }
  </style>

  <!-- Prevent caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

</head>
<body>

<header id="navbar">
  <div class="container">
    <nav>
      <div class="logo">Nasila Afla Self Help Group</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#store">Store</a>
        <a href="index.html#team">Team</a>
        <a href="cart.html">Cart</a>
      </div>
    </nav>
  </div>
</header>

<div class="cart-container">

  <div>
    <h2>Your Order</h2>
    <div id="cart-items"></div>
  </div>

  <div class="summary">
    <h3>Payment Summary</h3>
    <p><span>Subtotal</span><span id="subtotal">KES 0</span></p>
    <hr />
    <p><strong>Total</strong><strong id="total">KES 0</strong></p>

    <h4 style="margin-top:25px">Payment Details</h4>
    <p>M-PESA Number:<br><strong>+254702171437</strong></p>
    <p>M-PESA Till:<br><strong>3358164</strong></p>

    <button class="checkout" onclick="placeOrder()">Place Order</button>
    <button class="clear-btn" onclick="clearOrder()">Clear Order</button>
  </div>

</div>

<script>
  // Reset cart on page load to prevent caching
  localStorage.setItem('cart', JSON.stringify([]));

  const products = [
    { name: 'Latte', price: 250 },
    { name: 'Irish Coffee', price: 300 },
    { name: 'Caffè Macchiato', price: 280 }
  ];

  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  products.forEach(p => {
    if (!cart.find(item => item.name === p.name)) {
      cart.push({ ...p, qty: 0 });
    }
  });

  const cartContainer = document.getElementById('cart-items');
  const subtotalEl = document.getElementById('subtotal');
  const totalEl = document.getElementById('total');

  function renderCart() {
    cartContainer.innerHTML = '';
    let subtotal = 0;

    cart.forEach((item, index) => {
      subtotal += item.price * item.qty;

      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <h4>${item.name}</h4>
        <span>KES ${item.price}</span>
        <div class="qty">
          <button onclick="updateQty(${index}, -1)">−</button>
          <span>${item.qty}</span>
          <button onclick="updateQty(${index}, 1)">+</button>
        </div>
        <strong>KES ${item.price * item.qty}</strong>
      `;
      cartContainer.appendChild(div);
    });

    subtotalEl.textContent = `KES ${subtotal}`;
    totalEl.innerHTML = `<strong>KES ${subtotal}</strong>`;

    localStorage.setItem('cart', JSON.stringify(cart));
  }

  function updateQty(index, change) {
    cart[index].qty = Math.max(0, cart[index].qty + change);
    renderCart();
  }

  function clearOrder() {
    cart.forEach(item => item.qty = 0);
    renderCart();
  }

  function placeOrder() {
    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

    if (total === 0) {
      alert('Your cart is empty. Coffee first! ☕');
      return;
    }

    alert(`Hey there 👋\n\nThank you for your order!\n\nKindly pay \u001b[1mKES ${total}\u001b[0m using any of the options below:\n\n1️⃣ M-PESA Number: +254702171437\n2️⃣ M-PESA Till: 3358164\n\nOnce payment is complete, we’ll process your order immediately 🚀`);

    clearOrder();
  }

  renderCart();
</script>

</body>
</html>
